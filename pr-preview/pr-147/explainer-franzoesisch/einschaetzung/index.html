<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../">Start</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-language-text"><p>Übersetze. Schreib auf Französisch.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-language-text"><p>Fülle die Tabelle aus.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-language-text"><p>Schreib zu jedem Buchstaben das französische Wort mit seinem Artikel.</p></div><figure class="block-figure block-labelled"><div class="block-labelled-image block-labelled-fill"><img src="../images/tisch.svg" alt="Ein gedeckter Tisch. A ein Brot, B ein Apfel, C ein Stück Käse, D ein Glas Wasser." loading="lazy" decoding="async"><span class="block-marker" style="left: 20%; top: 40%" aria-hidden="true">A</span><span class="block-marker" style="left: 45%; top: 40%" aria-hidden="true">B</span><span class="block-marker" style="left: 68%; top: 45%" aria-hidden="true">C</span><span class="block-marker" style="left: 88%; top: 25%" aria-hidden="true">D</span></div><figcaption> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC0-1.0.</span></figcaption></figure><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="explainer-language-text"><p>Wähle für jede Lücke das passende Wort.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-back">Zurück</button> <button type="button" class="explainer-assessment-finish">Auswerten</button></p>
</section>
<section class="explainer-assessment-result" aria-labelledby="ergebnis" hidden>
<h2 id="ergebnis" tabindex="-1">Dein Ergebnis</h2>
<p class="explainer-assessment-score"></p>
<p class="explainer-assessment-advice"></p>
<ol class="explainer-assessment-pages"></ol>
<div class="explainer-assessment-tutor">
<h3>Mit einem KI-Tutor weiterlernen</h3>
<p>Ein KI-Tutor kann mit deinem Ergebnis die Seiten mit dir durchgehen, die noch nicht sitzen. Dein Klick gibt ihm das Ergebnis und deine Eingaben; sonst schickt die App nichts weg.</p>

<p class="explainer-tutor-hint" role="status" aria-live="polite" hidden></p>
<p class="explainer-assessment-tutor-status" role="status" aria-live="polite"></p>
<p class="explainer-tutor-note">Du nutzt dein eigenes Konto beim Anbieter. Der Assistent ist kein Angebot von lernapps.net: lernapps liefert nur Inhalte und Übungen.</p>
<p><a class="explainer-assessment-tutor-page" href="../einschaetzung/tutor/">Ansehen, was dein Tutor bekommt</a></p>
</div>
