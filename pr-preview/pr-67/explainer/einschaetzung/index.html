<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In einer Klasse mit 25 Schülern haben 10 ein Haustier. Mit welcher Rechnung bekommst du den Prozentsatz?</legend>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>10 : 25 · 100</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>25 : 10 · 100</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>10 · 25 : 100</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>10 : 25 · 100</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Teil durch Ganzes, dann mal 100. So kommt der Anteil in Hundertsteln heraus.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>25 : 10 · 100</strong></p><p>Hier wird das Ganze durch den Teil geteilt. Das ergibt 250 %, mehr als die ganze Klasse.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>10 · 25 : 100</strong></p><p>So rechnest du einen Prozentwert aus, nicht einen Prozentsatz. Es kommen 2,5 heraus.</p></li>
</ul>
<p class="question-explanation">Der Prozentsatz ist Teil durch Ganzes, mal 100. Der Teil sind die 10 Schüler mit Haustier, das Ganze die 25 Schüler der Klasse, also 10 : 25 · 100 = 40 %.</p>
