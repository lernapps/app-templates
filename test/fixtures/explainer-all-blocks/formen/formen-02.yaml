# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json

title: { de: "Formen 2", en: "Shapes 2" }
description: { de: "Seite 4 der Fixture mit allen Blöcken.", en: "Page 4 of the fixture with all blocks." }
blocks:
  - type: text
    text:
      de: |
        Diese Seite ist Seite **4** von 4. Auf ihr steht $n = 4$, und *jede* Art von Block.

        - Weiter geht es mit [der nächsten Seite](/formen/formen-01/#grundlagen).
        - Mehr steht in der [Wikipedia](https://de.wikipedia.org/wiki/Prozentrechnung).
      en: |
        This page is page **4** of 4. It says $n = 4$, and has *every* kind of block.

        - Go on with [the next page](/formen/formen-01/#grundlagen).
        - Read more in [Wikipedia](https://de.wikipedia.org/wiki/Prozentrechnung).
  - type: section
    id: grundlagen
    title: { de: "Grundlagen", en: "Basics" }
    blocks:
      - type: formula
        formula: '\frac{4}{100} \cdot 200 = 8'
      - type: definition
        term: { de: "Begriff 4", en: "Term 4" }
        explanation:
          { de: "Ein Begriff, den Seite 4 erklärt, mit $4\\,\\%$.", en: "A term that page 4 explains, with $4\\,\\%$." }
      - type: figure
        draw: { kind: hundred-grid, filled: 4 }
        alt: { de: "Ein Hunderterfeld, 4 von 100 Kästchen gefärbt", en: "A hundred grid, 4 of 100 squares shaded" }
        caption: { de: "4 % des Ganzen.", en: "4 % of the whole." }
      - type: section
        id: tabelle
        title: { de: "Tabelle", en: "Table" }
        blocks:
          - type: table
            caption: { de: "Werte der Seite 4", en: "Values of page 4" }
            header: [{ de: "Größe", en: "Quantity" }, { de: "Wert", en: "Value" }, { de: "Formel", en: "Formula" }]
            rowHeaders: true
            rows:
              - [{ de: "Prozentsatz", en: "Percentage" }, { de: "4", en: "4" }, { de: "$p = 4$", en: "$p = 4$" }]
              - [{ de: "Grundwert", en: "Base value" }, { de: "200", en: "200" }, { de: "$G = 200$", en: "$G = 200$" }]
          - type: figure
            draw: { kind: bar, part: 4, whole: 4 }
            alt: { de: "Ein Streifen, 4 von 4 Teilen gefärbt", en: "A strip, 4 of 4 parts shaded" }
            caption: { de: "Wie weit du in der App bist.", en: "How far you are in the app." }
      - type: section
        id: geschichte
        title: { de: "Geschichte", en: "History" }
        blocks:
          - type: timeline
            events:
              - date: -300
                title: { de: "Euklid schreibt die Elemente", en: "Euclid writes the Elements" }
              - date: 1202
                label: { de: "im Jahr 1202", en: "in 1202" }
                title: { de: "Fibonacci schreibt das Liber Abaci", en: "Fibonacci writes the Liber Abaci" }
                text:
                  {
                    de: "Damit kommen die **arabischen Ziffern** nach Europa.",
                    en: "With it, the **Arabic numerals** come to Europe.",
                  }
          - type: quote
            text: { de: "Πάντα ῥεῖ", en: "Πάντα ῥεῖ" }
            origin:
              author: { de: "Heraklit", en: "Heraclitus" }
              year: { de: "um 500 v. Chr.", en: "around 500 BC" }
            source:
              {
                de: "Heraklit, Fragmente, überliefert bei Simplikios",
                en: "Heraclitus, fragments, handed down by Simplicius",
              }
            licence: gemeinfrei
  - type: section
    id: anwendung
    title: { de: "Anwendung", en: "Application" }
    blocks:
      - type: code
        language: javascript
        caption: { de: "Ein kleines Programm", en: "A small program" }
        code: |
          const doppelt = (n) => 2 * n;
          console.log(doppelt(21));
      - type: example
        title: { de: "Beispiel 4", en: "Example 4" }
        blocks:
          - type: text
            text: { de: "Knallgas reagiert zu Wasser:", en: "Oxyhydrogen reacts to water:" }
          - type: formula
            formula: '\ce{2H2 + O2 -> 2H2O}'
      - type: note
        title: { de: "Merke", en: "Remember" }
        blocks:
          - type: text
            text: { de: "Die Reaktion setzt $\\pu{572 kJ}$ frei.", en: "The reaction releases $\\pu{572 kJ}$." }
      - type: section
        id: bilder
        title: { de: "Bilder", en: "Pictures" }
        blocks:
          - type: figure
            image: images/raster.svg
            alt:
              {
                de: "Ein blauer Kreis, ein grünes Quadrat und ein rotes Dreieck",
                en: "A blue circle, a green square and a red triangle",
              }
            caption: { de: "Drei Formen.", en: "Three shapes." }
            source: { de: "eigene Zeichnung", en: "own drawing" }
            licence: CC0-1.0
          - type: labelled-figure
            image: images/raster.svg
            alt: { de: "Drei Formen mit Nummern", en: "Three shapes with numbers" }
            caption: { de: "Die Formen, nummeriert.", en: "The shapes, numbered." }
            labels:
              - { x: 20, y: 50, text: { de: "Kreis", en: "Circle" } }
              - { x: 55, y: 50, text: { de: "Quadrat", en: "Square" } }
              - { x: 88, y: 60, text: { de: "Dreieck", en: "Triangle" } }
            source: { de: "eigene Zeichnung", en: "own drawing" }
            licence: CC0-1.0
          - type: timeline
            data: ereignisse
          - type: video
            youtube: rkLmLaFHodo
            title: einstufiger Zufallsversuch | Wahrscheinlichkeitsrechnung - einfach erklärt
            channel: Lehrerschmidt
  - type: section
    id: uebung
    title: { de: "Übung", en: "Exercise" }
    blocks:
      - type: matching
        id: formen-ecken
        text: { de: "Ordne jeder Form die Zahl ihrer Ecken zu.", en: "Match each shape with its number of corners." }
        pairs:
          - { left: { de: "Dreieck", en: "Triangle" }, right: { de: "drei", en: "three" } }
          - { left: { de: "Quadrat", en: "Square" }, right: { de: "vier", en: "four" } }
          - { left: { de: "Kreis", en: "Circle" }, right: { de: "keine", en: "none" } }
        explanation: { de: "Ein Kreis hat keine Ecken.", en: "A circle has no corners." }
        examples:
          accepted: [[[Kreis, keine], [Dreieck, drei], [Quadrat, vier]]]
          rejected: [[[0, 1], [1, 0], [2, 2]]]
        links:
          - title: { de: "Kreis (Wikipedia)", en: "Circle (Wikipedia, German)" }
            url: https://de.wikipedia.org/wiki/Kreis_(Geometrie)
      - type: generated
        id: symbole
        given:
          es: { pick: 3, distinct: true, from: { data: elemente } }
        task:
          text: { de: "Ordne jedem Element sein Symbol zu.", en: "Match each element with its symbol." }
        answer: { value: "es", compare: { pairs: { left: name, right: symbol } } }
      - type: open-task
        id: erklaeren
        task:
          { de: "Erkläre in zwei Sätzen, was diese Seite zeigt.", en: "Explain in two sentences what this page shows." }
        points:
          - text: { de: "Nennt die Grundlagen der Seite.", en: "Names the basics of the page." }
            source: /formen/formen-02/#grundlagen
          - text: { de: "Nennt eine Anwendung.", en: "Names an application." }
            source: /formen/formen-02/#anwendung
          - text: { de: "Schreibt ganze Sätze.", en: "Writes whole sentences." }
            kind: form
        solution:
          {
            de: "Die Seite zeigt die Grundlagen mit einer Formel. Sie wendet sie in einem Beispiel an.",
            en: "The page shows the basics with a formula. It applies them in an example.",
          }
        hint: { de: "Schau dir die Abschnitte der Seite an.", en: "Look at the sections of the page." }
