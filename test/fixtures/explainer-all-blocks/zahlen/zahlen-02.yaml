# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json

title: { de: "Zahlen 2", en: "Numbers 2" }
description: { de: "Seite 2 der Fixture mit allen Blöcken.", en: "Page 2 of the fixture with all blocks." }
blocks:
  - type: text
    text:
      de: |
        Diese Seite ist Seite **2** von 4. Auf ihr steht $n = 2$, und *jede* Art von Block.

        - Weiter geht es mit [der nächsten Seite](/zahlen/zahlen-01/#grundlagen).
        - Mehr steht in der [Wikipedia](https://de.wikipedia.org/wiki/Prozentrechnung).
      en: |
        This page is page **2** of 4. It says $n = 2$, and has *every* kind of block.

        - Go on with [the next page](/zahlen/zahlen-01/#grundlagen).
        - Read more in [Wikipedia](https://de.wikipedia.org/wiki/Prozentrechnung).
  - type: section
    id: grundlagen
    title: { de: "Grundlagen", en: "Basics" }
    blocks:
      - type: formula
        formula: '\frac{2}{100} \cdot 200 = 4'
      - type: definition
        term: { de: "Begriff 2", en: "Term 2" }
        explanation:
          { de: "Ein Begriff, den Seite 2 erklärt, mit $2\\,\\%$.", en: "A term that page 2 explains, with $2\\,\\%$." }
      - type: figure
        draw: { kind: hundred-grid, filled: 2 }
        alt: { de: "Ein Hunderterfeld, 2 von 100 Kästchen gefärbt", en: "A hundred grid, 2 of 100 squares shaded" }
        caption: { de: "2 % des Ganzen.", en: "2 % of the whole." }
      - type: section
        id: tabelle
        title: { de: "Tabelle", en: "Table" }
        blocks:
          - type: table
            caption: { de: "Werte der Seite 2", en: "Values of page 2" }
            header: [{ de: "Größe", en: "Quantity" }, { de: "Wert", en: "Value" }, { de: "Formel", en: "Formula" }]
            rowHeaders: true
            rows:
              - [{ de: "Prozentsatz", en: "Percentage" }, { de: "2", en: "2" }, { de: "$p = 2$", en: "$p = 2$" }]
              - [{ de: "Grundwert", en: "Base value" }, { de: "200", en: "200" }, { de: "$G = 200$", en: "$G = 200$" }]
          - type: figure
            draw: { kind: bar, part: 2, whole: 4 }
            alt: { de: "Ein Streifen, 2 von 4 Teilen gefärbt", en: "A strip, 2 of 4 parts shaded" }
            caption: { de: "Wie weit du in der App bist.", en: "How far you are in the app." }
      - type: section
        id: geschichte
        title: { de: "Geschichte", en: "History" }
        blocks:
          - type: timeline
            events:
              - date: -300
                title: { de: "Euklid schreibt die Elemente", en: "Euclid writes the Elements" }
              - date: 1202
                label: { de: "im Jahr 1202", en: "in 1202" }
                title: { de: "Fibonacci schreibt das Liber Abaci", en: "Fibonacci writes the Liber Abaci" }
                text:
                  {
                    de: "Damit kommen die **arabischen Ziffern** nach Europa.",
                    en: "With it, the **Arabic numerals** come to Europe.",
                  }
          - type: quote
            text: { de: "Πάντα ῥεῖ", en: "Πάντα ῥεῖ" }
            origin:
              author: { de: "Heraklit", en: "Heraclitus" }
              year: { de: "um 500 v. Chr.", en: "around 500 BC" }
            source:
              {
                de: "Heraklit, Fragmente, überliefert bei Simplikios",
                en: "Heraclitus, fragments, handed down by Simplicius",
              }
            licence: gemeinfrei
  - type: section
    id: anwendung
    title: { de: "Anwendung", en: "Application" }
    blocks:
      - type: code
        language: python
        caption: { de: "Ein kleines Programm", en: "A small program" }
        code: |
          def doppelt(n):
              return 2 * n

          print(doppelt(21))
      - type: example
        title: { de: "Beispiel 2", en: "Example 2" }
        blocks:
          - type: text
            text: { de: "Knallgas reagiert zu Wasser:", en: "Oxyhydrogen reacts to water:" }
          - type: formula
            formula: '\ce{2H2 + O2 -> 2H2O}'
      - type: note
        title: { de: "Merke", en: "Remember" }
        blocks:
          - type: text
            text: { de: "Die Reaktion setzt $\\pu{572 kJ}$ frei.", en: "The reaction releases $\\pu{572 kJ}$." }
      - type: section
        id: bilder
        title: { de: "Bilder", en: "Pictures" }
        blocks:
          - type: figure
            image: images/raster.svg
            alt:
              {
                de: "Ein blauer Kreis, ein grünes Quadrat und ein rotes Dreieck",
                en: "A blue circle, a green square and a red triangle",
              }
            caption: { de: "Drei Formen.", en: "Three shapes." }
            source: { de: "eigene Zeichnung", en: "own drawing" }
            licence: CC0-1.0
          - type: labelled-figure
            image: images/raster.svg
            alt: { de: "Drei Formen mit Nummern", en: "Three shapes with numbers" }
            caption: { de: "Die Formen, nummeriert.", en: "The shapes, numbered." }
            labels:
              - { x: 20, y: 50, text: { de: "Kreis", en: "Circle" } }
              - { x: 55, y: 50, text: { de: "Quadrat", en: "Square" } }
              - { x: 88, y: 60, text: { de: "Dreieck", en: "Triangle" } }
            source: { de: "eigene Zeichnung", en: "own drawing" }
            licence: CC0-1.0
          - type: timeline
            data: ereignisse
  - type: section
    id: uebung
    title: { de: "Übung", en: "Exercise" }
    blocks:
      - type: multiple-choice
        id: gerade-prozente
        text: { de: "Welche Anteile sind genau die Hälfte?", en: "Which shares are exactly one half?" }
        explanation: { de: "Die Hälfte sind 50 % oder 1/2.", en: "One half is 50 % or 1/2." }
        links:
          - title: { de: "Bruchrechnung (Wikipedia)", en: "Fractions (Wikipedia, German)" }
            url: https://de.wikipedia.org/wiki/Bruchrechnung
        options:
          - text: { de: "50 %", en: "50 %" }
            correct: true
            info: { de: "50 von 100.", en: "50 of 100." }
          - text: { de: "1/2", en: "1/2" }
            correct: true
            info: { de: "Eins von zwei.", en: "One of two." }
          - text: { de: "25 %", en: "25 %" }
            correct: false
            info: { de: "Ein Viertel.", en: "One quarter." }
      - type: true-false
        id: hundert-prozent
        text: { de: "100 % sind das Ganze.", en: "100 % is the whole." }
        answer: true
        explanation: { de: "Der Grundwert ist 100 %.", en: "The base value is 100 %." }
        hint: { de: "Lies noch einmal, was der Grundwert ist.", en: "Read again what the base value is." }
        links:
          - title: { de: "Prozent (Wikipedia)", en: "Percent (Wikipedia, German)" }
            url: https://de.wikipedia.org/wiki/Prozent
      - type: generated
        id: hauptgruppe
        given:
          e: { pick: 1, from: { data: elemente } }
        where: ["e.group != e.period"]
        task:
          text:
            {
              de: "In welcher Hauptgruppe steht {{e.name}} ({{e.symbol}})?",
              en: "In which main group is {{e.name}} ({{e.symbol}})?",
            }
        answer: { value: "e.group", compare: { choice: [1, 2, 3, 4, 5, 6, 7, 8] } }
        mistakes:
          - value: "e.period"
            message:
              {
                de: "Das ist die Periode, also die Zeile. Die Hauptgruppe ist die Spalte.",
                en: "That is the period, the row. The main group is the column.",
              }
