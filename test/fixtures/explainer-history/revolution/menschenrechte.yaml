# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title:
  de: Die Menschenrechte
  en: The rights of man
blocks:
  - type: section
    id: quelle
    title:
      de: Quelle
      en: Source
    blocks:
      - type: quote
        text:
          de: Les hommes naissent et demeurent libres et égaux en droits.
          en: Les hommes naissent et demeurent libres et égaux en droits.
        origin:
          author:
            de: Französische Nationalversammlung
            en: French National Assembly
          work:
            de: Erklärung der Menschen- und Bürgerrechte, Artikel 1
            en: Declaration of the Rights of Man and of the Citizen, article 1
          year: 1789
        source: https://fr.wikisource.org/wiki/Déclaration_des_droits_de_l’homme_et_du_citoyen
        licence: gemeinfrei
      - type: text
        text:
          de: "Auf Deutsch: Die Menschen werden frei und gleich an Rechten geboren und bleiben es."
          en: "In English: Men are born and remain free and equal in rights."
  - type: section
    id: einordnung
    title:
      de: Einordnung
      en: Context
    blocks:
      - type: definition
        term:
          de: Menschenrechte
          en: Human rights
        explanation:
          de: Rechte, die jeder Mensch hat, weil er ein Mensch ist, und die kein Staat ihm nehmen darf.
          en: Rights that every person has because they are human, and that no state may take away.
      - type: text
        text:
          de: |
            Die Erklärung vom 26. August 1789 galt zunächst nur für Männer. Olympe de Gouges forderte 1791 in einer
            eigenen Erklärung dieselben Rechte für Frauen.
          en: |
            The declaration of 26 August 1789 at first applied only to men. In 1791 Olympe de Gouges demanded the same
            rights for women in a declaration of her own.
