# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
# Each page of an explainer will end with an exercise (section Übung). Exercises come with the next version of the
# explainer runtime; its schema will then require one on every page.
title: Prozentwert
description: "Den Prozentwert berechnen: W = G · p : 100, mit einem Beispiel und dem Hunderterfeld."
blocks:
  - type: section
    id: warum
    title: Warum
    blocks:
      - type: text
        text: |
          „20 % Rabatt auf 80 €“: Wie viel sparst du wirklich? Der Prozentwert ist der Teil des Ganzen, den die
          Prozente beschreiben. Wer ihn schnell ausrechnen kann, weiß beim Einkaufen, beim Handy-Akku und in jeder
          Statistik sofort, worum es geht.
  - type: section
    id: regel
    title: Regel
    blocks:
      - type: formula
        formula: 'W = \frac{G \cdot p}{100}'
      - type: definition
        term: Prozentwert
        explanation: |
          Der Prozentwert $W$ ist der Anteil am Ganzen, in der Einheit des Grundwerts (€, Schüler, mAh …).
      - type: text
        text: |
          Der **Grundwert** $G$ ist das Ganze, also 100 %. Der **Prozentsatz** $p\,\%$ sagt, welcher Anteil gemeint
          ist. mAh (Milliamperestunden) gibt an, wie viel Ladung ein Akku speichert.
      - type: note
        title: Merkhilfe
        blocks:
          - type: text
            text: Erst 1 % ausrechnen ($G$ geteilt durch 100), dann mal $p$ nehmen.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Rabatt auf ein Skateboard
        blocks:
          - type: text
            text: Ein Skateboard kostet 250 €. Es gibt 12 % Rabatt. Wie viel Euro sparst du?
          - type: table
            caption: Der Prozentwert beim Skateboard
            rowHeaders: true
            rows:
              - [Grundwert $G$, 250 € (der volle Preis)]
              - [Prozentsatz $p$, 12 %]
              - [Rechnung, '$W = 250 \cdot 12 : 100 = 30$']
              - [Prozentwert $W$, "**30 €** Rabatt"]
          - type: figure
            draw: { kind: hundred-grid, filled: 12 }
            alt: Ein Hunderterfeld mit 100 Kästchen, 12 davon sind gefärbt.
            caption: Das Hunderterfeld ist der Grundwert, 100 Kästchen sind 100 %. Die 12 gefärbten Kästchen sind der Prozentwert.
          - type: text
            text: "Über 1 %: 250 € : 100 = 2,50 € sind 1 %. Dann 2,50 € · 12 = 30 €."
