# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title: Prozent
summary: Mit Prozenten vergleichst du Anteile, egal wie groß das Ganze ist.
pages: [prozentwert, prozentsatz, grundwert]
# The chapter's self-assessment, offered on the start page (an app with one chapter): three or four tasks per page,
# prozentwert-ueben and the exercise component prozentfeld each drawing a task of their own, the open task
# tauschen-erklaeren answered in the learner's own words.
selfAssessment:
  pages:
    - exercises:
        - /prozent/prozentwert/#prozentwert-ueben
        - /prozent/prozentwert/#prozentfeld
        - /prozent/prozentwert/#tauschen-erklaeren
        - /prozent/prozentsatz/#welche-rechnung
    - exercises:
        - /prozent/prozentsatz/#prozentsatz-ueben
        - /prozent/grundwert/#klammern
        - /prozent/grundwert/#grundwert-ueben
