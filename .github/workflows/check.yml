name: Check

# The runtime package at the root (format, lint, type check, unit tests, build) and every template folder as an app:
# `lernapps check` (format, lint, type check, unit tests, build, the checks of the built app, the end-to-end tests)
# passes in each, with the runtime of this commit (file:..) and the @lernapps/tooling version the folder pins.
#
# The change scope (the reusable workflow changes.yml of lernapps/tooling, with "kind": "app" in package.json) gates
# every job: a change of only the plan (.vibe/**) or only docs (docs/**/*.md; this repo has no site) checks nothing.
# The pre-push hook (scripts/pre-push.ts) runs a subset; CI runs every job on every other change, and so catches what
# the hook's positive list misses. The job `check` always runs and reports the overall result: it is the check to
# require, and it never stays "Pending" (a skipped matrix job reports under its unexpanded name, so the gated jobs'
# names stay but are no longer a reliable required check).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: lernapps/tooling/.github/workflows/changes.yml@1753716aed56101a610283b690750f1767d8a623 # main
    with:
      tooling-ref: 1753716aed56101a610283b690750f1767d8a623 # the classifier the pre-push hook runs (TOOLING_REF)

  runtime:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # @lernapps/tooling is an optional peer (apps have it); the type check needs it: the version the quiz pins.
      # --save-dev: npm 11 installs a package that package.json names as an optional peer as that peer, so not at all.
      - run: npm install --no-save --save-dev --no-audit --no-fund "$(node -p 'require("./quiz/package.json").devDependencies["@lernapps/tooling"]')"
      - run: npx vp check
      # the .vue files of the fixtures, which the type check of vp check does not read
      - run: npm run check:vue
      - run: npx vp test run

  template:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        template: [quiz, explainer, interactive]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci # the runtime's build tools, for file:..
      # no hooks before the template's install, so that any hooks it installs set core.hooksPath for the step below
      - run: git config --unset core.hooksPath || true
      - run: npm install --no-audit --no-fund
        working-directory: ${{ matrix.template }}
      # a template installs no git hooks: they would point this whole repo at the template's hooks. The root's own
      # (.vite-hooks/, which the root's prepare installs, also when the template's install builds file:..) are fine.
      - name: npm install left the repo's hooks alone
        run: |
          hooks=$(git config core.hooksPath || true)
          case "$hooks" in "" | .vite-hooks/_) ;; *) echo "core.hooksPath is $hooks"; exit 1 ;; esac
      - run: npx lernapps check
        working-directory: ${{ matrix.template }}

  # The quiz template as an app with a large question bank (test/fixtures/quiz-many-questions.json, 64 questions of
  # every type) in place of its own: the end-to-end tests of every quiz must pass however many questions an app has.
  quiz-many-questions:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci # the runtime's build tools, for file:..
      - run: npm install --no-audit --no-fund
        working-directory: quiz
      - run: cp ../test/fixtures/quiz-many-questions.json src/quiz.json
        working-directory: quiz
      - run: npx lernapps check --pre-push
        working-directory: quiz

  # The quiz template as an app with a small bank in German and English (test/fixtures/quiz-bilingual.json) in place of
  # its own: a page per language, German at the root and English below en/, each with its language, its alternates and
  # a language switch; the end-to-end tests of every quiz run in full in German and briefly in English.
  quiz-bilingual:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci # the runtime's build tools, for file:..
      - run: npm install --no-audit --no-fund
        working-directory: quiz
      - run: cp ../test/fixtures/quiz-bilingual.json src/quiz.json
        working-directory: quiz
      - run: npx lernapps check --pre-push
        working-directory: quiz

  # The quiz template as an app whose questions show content (test/fixtures/quiz-material): a bank in German and English
  # with a figure, a labelled figure, a table, a formula, prose, a quotation and code, and two bundled images in
  # src/images/. The build checks the blocks and carries the images; the end-to-end tests see each kind of block, load
  # each image from the page of each language, and read the page without JavaScript.
  quiz-material:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci # the runtime's build tools, for file:..
      - run: npm install --no-audit --no-fund
        working-directory: quiz
      - run: cp ../test/fixtures/quiz-material/quiz.json src/quiz.json && mkdir -p src/images && cp -r ../test/fixtures/quiz-material/images/. src/images/
        working-directory: quiz
      - run: npx lernapps check --pre-push
        working-directory: quiz

  # The explainer template as an app with the content of a fixture in place of its own: two of each, two chapters of
  # two pages in German and English with two section levels, every block type on every page and every exercise type
  # (test/fixtures/explainer-all-blocks, with an open task on every page and a scope); and a short history app with one chapter, which the navigation hides
  # (test/fixtures/explainer-history: timeline, quote, definition, an ordering exercise, a generated exercise from a
  # data file, and a component, a figure whose levels the learner labels, with its logic module and its test). The
  # build, the checks of the built app, the unit tests and the end-to-end tests of every explainer pass on both.
  explainer-fixtures:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        fixture: [explainer-all-blocks, explainer-history]
    name: ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci # the runtime's build tools, for file:..
      - run: npm install --no-audit --no-fund
        working-directory: explainer
      - run: rm -r src/app.yaml src/prozent && cp -r "../test/fixtures/${{ matrix.fixture }}/." src/
        working-directory: explainer
      - run: npx lernapps check --pre-push
        working-directory: explainer

  # A page of another archetype, as the explainer will be, that embeds one question of each type through the quiz
  # runtime's per-question exports (test/fixtures/question-page): `lernapps check` with its end-to-end tests, with and
  # without JavaScript. It runs on the @lernapps/tooling version the quiz pins, which Renovate keeps current.
  question-page:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci # the runtime's build tools, for file:../../..
      - run: npm pkg set "devDependencies.@lernapps/tooling=$(node -p 'require("../../../quiz/package.json").devDependencies["@lernapps/tooling"]')"
        working-directory: test/fixtures/question-page
      - run: npm install --no-audit --no-fund
        working-directory: test/fixtures/question-page
      - run: npx lernapps check
        working-directory: test/fixtures/question-page

  # The architecture: every combination of the generic part (docs/arc42/) and one template's extension
  # (<template>/docs/arc42/) passes `arc42 validate --strict` without any finding (scripts/arc42.ts, which the
  # pre-commit hook also runs). An app will run `arc42 diff --staged --strict`; this repo, with one architecture per
  # archetype, is gated by the script. Not gated by the change scope: a change of only the architecture's Markdown is
  # exactly what it checks.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts # only @doctc/arc42 is needed, not the runtime's build
      - run: node scripts/arc42.ts

  # The workflows; shellcheck (on the runner) checks their scripts.
  actionlint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  check: # the required status check: always runs, fails when a job above failed or was cancelled
    needs:
      [
        changes,
        runtime,
        template,
        quiz-many-questions,
        quiz-bilingual,
        quiz-material,
        explainer-fixtures,
        question-page,
        architecture,
        actionlint,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "the jobs ended: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
