name: Preview

# On main, the same bundle is published for good with the app publish action of lernapps/tooling (actions/app-publish):
# at the repo's address, https://lernapps.net/app-templates/, with quiz/, explainer/ and interactive/ below it, so that
# the example apps of the templates stay to be seen after a merge. The previews below pr-preview/ stay.

# A preview of the templates for every pull request, published like the preview of an app: the app preview action of
# lernapps/tooling (actions/app-preview) puts the bundle at <this repo's address>pr-preview/pr-<number>/, i.e.
# https://lernapps.net/app-templates/pr-preview/pr-<number>/, on the branch gh-pages, not indexed by search engines,
# updated on every push and removed when the pull request is closed or merged; one comment on the pull request links it.
# The action takes the artifact "app" (what app-check uploads for an app); here the job `bundle` makes it: the quiz,
# the explainer and the interactive template, each built as an app, below quiz/, explainer/ and interactive/, with a
# page that links them. check.yml checks the templates; this builds them. It needs GitHub Pages to serve gh-pages from
# its root (Settings → Pages → Deploy from a branch → gh-pages, / (root)). The actions ask the change scope (a change
# of only the plan .vibe/** or only docs gets no preview; closing always removes it), so there is no paths filter.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: lernapps/tooling/.github/workflows/changes.yml@73b90426ed503aa73e9e4f5f909724fd137b121c # main
    with:
      tooling-ref: 73b90426ed503aa73e9e4f5f909724fd137b121c

  bundle:
    needs: changes
    # main, or a pull request from this repo only (a fork's token may not write to gh-pages); closing removes the
    # preview, builds nothing
    if: >-
      github.event.action != 'closed' && needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci # the runtime's build tools, for file:..
      # no hooks before the templates' install, so that any hooks it installs leave core.hooksPath alone (see check.yml)
      - run: git config --unset core.hooksPath || true
      - name: Build the templates into preview/
        run: |
          mkdir preview
          for template in quiz explainer interactive; do
            (cd "$template" && npm install --no-audit --no-fund && npx vp build --outDir "$GITHUB_WORKSPACE/preview/$template")
          done
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Templates</title></head><body><h1>Templates</h1><ul>'
            for template in quiz explainer interactive; do echo "<li><a href=\"$template/\">$template</a></li>"; done
            echo '</ul></body></html>'
          } > preview/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: preview

  preview:
    needs: bundle
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.bundle.result == 'success' || needs.bundle.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: read # the address, for the comment
    steps:
      - uses: lernapps/tooling/actions/app-preview@41bffad2afcc823c19f741a13854d575ee52f282 # main

  deploy:
    # main only: the bundle of the templates' example apps, published at the repo's address
    needs: bundle
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.bundle.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: lernapps/tooling/actions/app-publish@69fca4b39d295ae30152f755ad3e8554e1df6aae # main
