name: Preview

# On main, the same bundle is published for good with the app publish action of lernapps/tooling (actions/app-publish):
# at the repo's address, https://lernapps.net/app-templates/, with quiz/, explainer/, explainer-franzoesisch/ (the
# explainer's example for a foreign language) and interactive/ below it, so that
# the example apps of the templates stay to be seen after a merge. The previews below pr-preview/ stay.

# A preview of the templates for every pull request, published like the preview of an app: the app preview action of
# lernapps/tooling (actions/app-preview) puts the bundle at <this repo's address>pr-preview/pr-<number>/, i.e.
# https://lernapps.net/app-templates/pr-preview/pr-<number>/, on the branch gh-pages, not indexed by search engines,
# updated on every push and removed when the pull request is closed or merged; one comment on the pull request links it.
# The action takes the artifact "app" (what app-check uploads for an app); here the job `bundle` makes it: the quiz,
# the explainer and the interactive template, each built as an app, below quiz/, explainer/ and interactive/, with a
# page that links them. check.yml checks the templates; this builds them. On a pull request the two explainers are built
# in the explainer's diff mode, against the base of the pull request (EXPLAINER_BASE, runtime/explainer/diff.ts): the
# pages of the preview mark the blocks the pull request adds, changes, moves and removes, and aenderungen/ lists them
# all. It needs GitHub Pages to serve gh-pages from its root (Settings → Pages → Deploy from a branch → gh-pages, / (root)). The actions ask the change scope (a change
# of only the plan .vibe/** or only docs gets no preview; closing always removes it), so there is no paths filter.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: lernapps/tooling/.github/workflows/changes.yml@d94928df642009c6f1c450eb6b3a1d374d4bc150 # main
    with:
      tooling-ref: d94928df642009c6f1c450eb6b3a1d374d4bc150

  bundle:
    needs: changes
    # main, or a pull request from this repo only (a fork's token may not write to gh-pages); closing removes the
    # preview, builds nothing
    if: >-
      github.event.action != 'closed' && needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # a pull request is checked out as its merge with the base: depth 2 has the base as its first parent
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: The base of the pull request, for the explainer's diff mode
        if: github.event_name == 'pull_request'
        run: |
          # without a base (a checkout that is no merge) the previews are built without marks
          if git rev-parse --verify --quiet HEAD^1 > /dev/null; then
            mkdir base
            git archive HEAD^1 | tar -x -C base
            # the foreign-language example is built in place of the template's content: its base is the same swap
            if [ -d base/explainer/examples/franzoesisch/src ]; then
              mkdir base-franzoesisch
              cp -r base/explainer/examples/franzoesisch/src base-franzoesisch/src
            fi
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci # the runtime's build tools, for file:..
      # no hooks before the templates' install, so that any hooks it installs leave core.hooksPath alone (see check.yml)
      - run: git config --unset core.hooksPath || true
      - name: Build the templates into preview/
        run: |
          mkdir preview
          # EXPLAINER_BASE: the base of the pull request for the explainer's diff mode; empty means none
          for template in quiz explainer interactive; do
            base=""
            if [ "$template" = explainer ] && [ -d "$GITHUB_WORKSPACE/base/explainer/src" ]; then
              base="$GITHUB_WORKSPACE/base/explainer"
            fi
            (cd "$template" && npm install --no-audit --no-fund &&
              EXPLAINER_BASE="$base" npx vp build --outDir "$GITHUB_WORKSPACE/preview/$template")
          done
          # the explainer's example for a foreign language (explainer/examples/franzoesisch), built in place of the
          # maths example, as check.yml checks it
          base=""
          if [ -d "$GITHUB_WORKSPACE/base-franzoesisch/src" ]; then base="$GITHUB_WORKSPACE/base-franzoesisch"; fi
          (cd explainer && rm -r src/app.yaml src/prozent src/components src/images && cp -r examples/franzoesisch/src/. src/ &&
            EXPLAINER_BASE="$base" npx vp build --outDir "$GITHUB_WORKSPACE/preview/explainer-franzoesisch")
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Templates</title></head><body><h1>Templates</h1><ul>'
            for template in quiz explainer interactive; do echo "<li><a href=\"$template/\">$template</a></li>"; done
            echo '<li><a href="explainer-franzoesisch/">explainer: example for a foreign language (French)</a></li>'
            # on a pull request: where the explainers list what it changes against its base
            for built in explainer explainer-franzoesisch; do
              if [ -d "preview/$built/aenderungen" ]; then echo "<li><a href=\"$built/aenderungen/\">$built: changes of this pull request</a></li>"; fi
            done
            echo '</ul></body></html>'
          } > preview/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: preview

  preview:
    needs: bundle
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.bundle.result == 'success' || needs.bundle.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: read # the address, for the comment
    steps:
      - uses: lernapps/tooling/actions/app-preview@d94928df642009c6f1c450eb6b3a1d374d4bc150 # main

  deploy:
    # main only: the bundle of the templates' example apps, published at the repo's address
    needs: bundle
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.bundle.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: lernapps/tooling/actions/app-publish@d94928df642009c6f1c450eb6b3a1d374d4bc150 # main
