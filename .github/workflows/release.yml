name: Release

# Publishes @lernapps/app-templates to npm, with provenance, when a version tag is pushed (git tag v0.1.0 && git push
# origin v0.1.0). npm trusts this workflow by its file name and this repository (npm trust github), so the file must stay
# named release.yml and needs no token: the job proves its identity with an OIDC token (id-token: write).
# The tag must name the version in package.json, so a release is never published under another version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: The tag names the version in package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      # npm ci runs `prepare`, which builds dist/ (vp pack)
      - run: npm ci
      - run: npm publish --provenance --access public
