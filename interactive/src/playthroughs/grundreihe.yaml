# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/interactive/playthrough.v1.schema.json
# A round of the Grundreihe with seed 1, whose letters are j a f l l s j k d l: a hit, a wrong key, two seconds that
# pass, three more that make the letter late, a capital letter that counts, the rest of the round; the button for the
# next round (the action "again"), that round typed through, and Enter for the one after it.
route: grundreihe
seed: 1
steps:
  - keys: [j]
    state: { index: 1, score: 1, misses: 0 }
    announce: Richtig. Tippe a.
  - keys: [x]
    state: { index: 1, score: 1, misses: 1 }
    announce: Falsch. Tippe a.
  - ticks: 100
    state: { index: 1, misses: 1, left: 3000 }
  - ticks: 150
    state: { index: 2, misses: 2, left: 5000, last: late }
    announce: Zu spät. Tippe f.
  - keys: [F]
    state: { index: 3, score: 2 }
    announce: Richtig. Tippe l.
  - keys: [l, l, s, j, k, d, l]
    state: { score: 9, misses: 2, done: true }
    announce: "Fertig: 9 von 10 richtig. Mit Enter spielst du noch eine Runde."
  - inputs: [{ kind: action, name: again }]
    state: { seed: 2, letters: kdsfljfdka, index: 0, score: 0, misses: 0, done: false }
    announce: Neue Runde. Tippe k.
  - keys: [k, d, s, f, l, j, f, d, k, a]
    state: { score: 10, misses: 0, done: true }
    announce: "Fertig: 10 von 10 richtig. Mit Enter spielst du noch eine Runde."
  - keys: [Enter]
    state: { seed: 3, letters: kafakffssf, index: 0, score: 0, done: false }
    announce: Neue Runde. Tippe k.
